{% if customers %}
{% for c in customers %}
<a href="/mobile/customers/{{ c.uuid }}" class="list-item">
    <div style="background:#eff6ff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;">
        <span style="font-size:.875rem;font-weight:800;color:#1d4ed8;">{{ c.name[0].upper() }}</span>
    </div>
    <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-900 truncate">{{ c.name }}</p>
        {% if c.address %}<p class="text-xs text-gray-400 truncate">{{ c.address }}</p>{% endif %}
    </div>
    <i class="ti ti-chevron-right" style="color:#d1d5db;flex-shrink:0;"></i>
</a>
{% endfor %}
{% else %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1rem;color:#94a3b8;">
    <i class="ti ti-building-off" style="font-size:3rem;margin-bottom:.75rem;"></i>
    <p style="font-size:.875rem;font-weight:600;">Nessun cliente trovato</p>
</div>
{% endif %}
