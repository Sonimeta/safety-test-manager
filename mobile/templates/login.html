<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>STM Mobile — Accesso</title>
    <link rel="manifest" href="/mobile/static/manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
        .form-input { display:block;width:100%;border:1.5px solid #e2e8f0;border-radius:12px;padding:.75rem 1rem;font-size:1rem;outline:none;background:#fff;color:#1e293b;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none; }
        .form-input:focus { border-color:#1e3a8a;box-shadow:0 0 0 3px rgba(30,58,138,.14); }
        .btn-login { width:100%;background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff;padding:.9rem 1rem;border-radius:14px;font-weight:700;font-size:1rem;border:none;cursor:pointer;letter-spacing:.01em;box-shadow:0 4px 16px rgba(30,58,138,.35);transition:opacity .15s,transform .1s; }
        .btn-login:active { opacity:.9;transform:scale(.99); }
        .btn-login:disabled { opacity:.5;cursor:not-allowed; }
    </style>
</head>
<body style="background:linear-gradient(160deg,#0f2057 0%,#1e3a8a 45%,#2563eb 100%);min-height:100vh;display:flex;flex-direction:column;">

    <!-- Logo area -->
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem 2rem;">
        <div style="background:#fff;border-radius:20px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.2);margin-bottom:1.25rem;">
            <i class="ti ti-shield-check" style="font-size:2.25rem;color:#1e3a8a;"></i>
        </div>
        <h1 style="color:#fff;font-size:1.6rem;font-weight:800;letter-spacing:.01em;margin:0;">STM Mobile</h1>
        <p style="color:rgba(255,255,255,.6);font-size:.875rem;margin-top:.25rem;">Safety Test Manager</p>
    </div>

    <!-- Login card -->
    <div style="background:#fff;border-radius:28px 28px 0 0;padding:2rem 1.5rem 2.5rem;box-shadow:0 -4px 40px rgba(0,0,0,.18);">
        <h2 style="font-size:1.25rem;font-weight:800;color:#0f172a;margin:0 0 .25rem;">Accedi</h2>
        <p style="font-size:.875rem;color:#64748b;margin:0 0 1.5rem;">Inserisci le tue credenziali per continuare</p>

        {% if error %}
        <div style="background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;border-radius:12px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.875rem;display:flex;align-items:center;gap:.5rem;">
            <i class="ti ti-alert-circle" style="font-size:1.1rem;flex-shrink:0;"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/mobile/auth/login" id="login-form" class="space-y-4">
            <div>
                <label style="display:block;font-size:.8125rem;font-weight:700;color:#374151;margin-bottom:.5rem;">Username</label>
                <div style="position:relative;">
                    <i class="ti ti-user" style="position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:1.1rem;"></i>
                    <input type="text" name="username" class="form-input" style="padding-left:2.75rem;"
                           placeholder="Inserisci username" autocomplete="username"
                           autocapitalize="none" required>
                </div>
            </div>
            <div>
                <label style="display:block;font-size:.8125rem;font-weight:700;color:#374151;margin-bottom:.5rem;">Password</label>
                <div style="position:relative;">
                    <i class="ti ti-lock" style="position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:1.1rem;"></i>
                    <input type="password" name="password" class="form-input" style="padding-left:2.75rem;"
                           placeholder="Inserisci password" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit" class="btn-login" id="login-btn" style="margin-top:.5rem;">
                Accedi
            </button>
        </form>

        <p style="text-align:center;font-size:.75rem;color:#94a3b8;margin-top:1.5rem;">
            Safety Test Manager &copy; 2026
        </p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function() {
            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;display:inline-block;margin-right:.4rem;"></i>Accesso in corso...';
            btn.disabled = true;
        });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/mobile/sw.js', { scope: '/mobile/' })
              .catch(() => {});
        }
        const style = document.createElement('style');
        style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(style);
    </script>
</body>
</html>
