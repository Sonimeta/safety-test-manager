{% extends "base.html" %}

{% block title %}Ricerca — STM Mobile{% endblock %}
{% block header_title %}Cerca{% endblock %}

{% block content %}
<div class="px-4 py-4">

    <!-- Search bar -->
    <div style="position:relative;margin-bottom:1rem;">
        <i class="ti ti-search" style="position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:1rem;pointer-events:none;"></i>
        <input type="search" name="q" id="global-search"
               class="form-input" style="padding-left:2.75rem;padding-right:2.5rem;"
               placeholder="Cerca S/N, AMS, descrizione, cliente..."
               autofocus
               hx-get="/mobile/partials/search-results"
               hx-trigger="input changed delay:400ms, search"
               hx-target="#search-results"
               hx-include="[name='q']"
               hx-indicator="#search-spinner">
        <span id="search-spinner" class="htmx-indicator" style="position:absolute;right:.875rem;top:50%;transform:translateY(-50%);">
            <i class="ti ti-loader-2 animate-spin" style="color:#1e3a8a;font-size:1rem;"></i>
        </span>
    </div>

    <div id="search-results">
        <div style="display:flex;flex-direction:column;align-items:center;padding:3rem 1rem;color:#cbd5e1;">
            <i class="ti ti-search" style="font-size:3.5rem;margin-bottom:.75rem;"></i>
            <p style="font-size:.875rem;font-weight:500;">Inizia a digitare per cercare</p>
            <p style="font-size:.75rem;margin-top:.25rem;color:#94a3b8;">S/N · Inventario AMS · Descrizione · Cliente</p>
        </div>
    </div>

</div>
{% endblock %}
