{% extends "base.html" %}

{% block title %}Ricerca — STM Mobile{% endblock %}
{% block header_title %}Cerca{% endblock %}

{% block content %}
<div class="px-4 py-4">

    <!-- Search bar -->
    <div class="relative mb-4">
        <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
        </div>
        <input type="search" name="q" id="global-search"
               class="form-input pl-9 bg-white"
               placeholder="Cerca per S/N, AMS, descrizione, cliente..."
               autofocus
               hx-get="/mobile/partials/search-results"
               hx-trigger="input changed delay:400ms, search"
               hx-target="#search-results"
               hx-include="[name='q']"
               hx-indicator="#search-spinner">
        <span id="search-spinner" class="htmx-indicator absolute inset-y-0 right-3 flex items-center">
            <svg class="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 22 6.477 22 12h-4z"></path>
            </svg>
        </span>
    </div>

    <div id="search-results">
        <div class="flex flex-col items-center py-12 text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <p class="text-sm">Inizia a digitare per cercare</p>
        </div>
    </div>

</div>
{% endblock %}
